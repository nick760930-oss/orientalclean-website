<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>東方繩洗｜Abstract Brand System</title><meta name="description" content="東方繩洗有限公司｜外牆清洗、修繕、防水與高空作業。"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Noto Sans TC","Helvetica Neue",Arial,sans-serif;background:#f9fcfc;color:#073943;overflow:hidden}:root{--b:#00AFC8;--deep:#073943;--ice:#e8f8fa;--line:#a8dfe6}
button{font:inherit}.shell{height:100%;position:relative;overflow:hidden;background:#fbfefe}.nav{position:absolute;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px 26px}.mark{font-size:13px;font-weight:600;letter-spacing:.08em}.navBtns{display:flex;gap:8px}.nav button{border:0;background:transparent;color:#446970;font-size:12px;padding:9px 10px;cursor:pointer}
.hero{position:absolute;inset:0;overflow:hidden}.blueField{position:absolute;right:0;top:0;width:24vw;height:100%;background:var(--b);transform:translateX(8%);transition:width 1.2s cubic-bezier(.2,.8,.2,1),transform 1.2s}.iceField{position:absolute;right:17vw;top:0;width:16vw;height:100%;background:var(--ice);transform:skewX(-4deg);transform-origin:bottom}
.grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(25% - .5px),#0739430d 25%,transparent calc(25% + .5px),transparent calc(50% - .5px),#0739430d 50%,transparent calc(50% + .5px),transparent calc(75% - .5px),#0739430d 75%,transparent calc(75% + .5px));opacity:.65}
.title{position:absolute;z-index:5;left:6vw;top:50%;transform:translateY(-50%)}.title small{font:10px ui-monospace,monospace;letter-spacing:.19em;color:#5b8188}.title h1{font-size:clamp(72px,13vw,190px);font-weight:500;line-height:.78;letter-spacing:-.085em;margin:28px 0 34px;color:var(--deep)}.title h1 span{color:var(--b)}.title p{max-width:530px;font-size:15px;line-height:1.8;color:#5c767c}
.rope{position:absolute;z-index:8;left:64%;top:-10%;height:120%;width:2px;background:var(--b);transform-origin:top;animation:sway 6s ease-in-out infinite;box-shadow:0 0 0 1px #00afc814}.rope:after{content:"";position:absolute;left:-5px;top:58%;width:12px;height:12px;border:2px solid var(--b);border-radius:50%;background:#fff}@keyframes sway{0%,100%{transform:rotate(-.35deg)}50%{transform:rotate(.45deg)}}
.measure{position:absolute;z-index:6;left:calc(64% + 18px);top:12%;bottom:10%;display:flex;flex-direction:column;justify-content:space-between;font:9px ui-monospace,monospace;color:#659098}.measure span:before{content:"";display:inline-block;width:18px;height:1px;background:#7bbdc5;margin-right:7px;vertical-align:middle}
.action{position:absolute;z-index:10;left:6vw;bottom:6vh;display:flex;gap:10px}.action button{border:1px solid #8fcbd2;background:#fff;color:#174c55;padding:13px 18px;cursor:pointer;transition:.3s}.action button.primary{background:var(--deep);border-color:var(--deep);color:#fff}.action button:hover{transform:translateY(-2px)}
.cursorLine{position:absolute;z-index:7;left:0;right:0;height:1px;background:#00afc84f;pointer-events:none;top:50%;transition:top .08s linear}
.projects{position:absolute;z-index:40;inset:0;background:#fff;transform:translateX(100%);transition:.9s cubic-bezier(.2,.8,.2,1);display:grid;grid-template-columns:28% 72%}.projects.open{transform:none}.projectMenu{padding:9vh 4vw;border-right:1px solid #dbe7e9}.projectMenu h2{font-size:clamp(36px,5vw,66px);font-weight:500;letter-spacing:-.055em;margin:0 0 8vh}.projectMenu button{display:block;border:0;background:none;padding:12px 0;color:#5a7379;cursor:pointer;text-align:left}.projectMenu button.on{color:var(--b)}.projectView{position:relative;overflow:hidden;background:#0c262c}.projectView img{width:100%;height:100%;object-fit:cover;opacity:.92;transition:.8s}.projectCaption{position:absolute;left:4vw;bottom:5vh;color:#fff}.projectCaption small{font:10px ui-monospace,monospace;color:#a9e5eb}.projectCaption h3{font-size:clamp(34px,5vw,70px);font-weight:500;letter-spacing:-.05em;margin:12px 0}.close{position:absolute;z-index:5;right:22px;top:20px;border:0;background:#ffffffd9;padding:10px 14px;cursor:pointer}
.journal{position:absolute;z-index:41;inset:0;background:var(--deep);color:#fff;transform:translateY(100%);transition:.9s cubic-bezier(.2,.8,.2,1);padding:9vh 6vw;overflow:auto}.journal.open{transform:none}.journal h2{font-size:clamp(48px,8vw,110px);font-weight:500;letter-spacing:-.07em;margin:0 0 8vh}.article{display:grid;grid-template-columns:130px 1fr;gap:24px;padding:28px 0;border-top:1px solid #ffffff2b}.article small{font:10px ui-monospace,monospace;color:#79dbe5}.article h3{font-size:clamp(22px,3vw,38px);font-weight:500;margin:0}.journal .close{color:#073943}
@media(max-width:720px){.nav{padding:16px}.navBtns button:first-child{display:none}.blueField{width:22vw}.iceField{right:15vw;width:20vw}.title{left:6vw;right:18vw;top:44%}.title h1{font-size:22vw;margin:20px 0 26px}.rope{left:78%}.measure{left:calc(78% + 13px)}.action{left:6vw;bottom:5vh}.projects{grid-template-columns:1fr;grid-template-rows:auto 1fr}.projectMenu{padding:6vh 5vw 2vh;border-right:0}.projectMenu h2{margin-bottom:2vh}.projectMenu button{display:inline-block;margin-right:14px}.projectView{min-height:65vh}.article{grid-template-columns:75px 1fr}}
@media(prefers-reduced-motion:reduce){.rope{animation:none}.projects,.journal{transition:none}}
</style></head><body><main class="shell" id="shell"><nav class="nav"><div class="mark">東方繩洗 / ORIENTAL CLEAN</div><div class="navBtns"><button>外牆工程</button><button id="projectBtn">工程案例</button><button id="journalBtn">工程筆記</button></div></nav><section class="hero"><div class="grid"></div><div class="iceField"></div><div class="blueField" id="blueField"></div><div class="rope"></div><div class="measure"><span>RF</span><span>30F</span><span>20F</span><span>10F</span><span>GL</span></div><div class="cursorLine" id="cursorLine"></div><div class="title"><small>FACADE WORK / TAIWAN</small><h1>東方<br><span>繩洗</span></h1><p>外牆清洗、修繕、防水與高空作業。依建築條件、材質與現場問題安排施工。</p></div><div class="action"><button class="primary" id="projectBtn2">看工程</button><button id="journalBtn2">工程筆記</button></div></section></main>
<section class="projects" id="projects"><aside class="projectMenu"><h2>工程</h2><button class="on" data-img="/images/case-dajiang.jpg" data-title="外牆工程紀錄">01　外牆工程</button><button data-img="/images/case-tonlin.jpg" data-title="高空施工紀錄">02　高空施工</button><button data-img="/images/case-morten41.jpg" data-title="建築外牆清潔">03　外牆清潔</button></aside><div class="projectView"><button class="close" id="closeProjects">關閉 ×</button><img id="projectImg" src="/images/case-dajiang.jpg" alt="工程案例"><div class="projectCaption"><small>SELECTED WORK</small><h3 id="projectTitle">外牆工程紀錄</h3></div></div></section>
<section class="journal" id="journal"><button class="close" id="closeJournal">關閉 ×</button><h2>工程筆記</h2><div class="article"><small>2026.09</small><h3>外牆防水做完後，牆角為什麼還會滲水？</h3></div><div class="article"><small>2026.09</small><h3>磁磚空鼓：灌注、局部修補與打除重做怎麼選？</h3></div><div class="article"><small>2026.09</small><h3>繩索作業和吊籠施工，差異不只在價格。</h3></div></section>
<script>
const line=document.getElementById('cursorLine'),field=document.getElementById('blueField');addEventListener('pointermove',e=>{line.style.top=(e.clientY/innerHeight*100)+'%';field.style.width=(20+e.clientX/innerWidth*9)+'vw'});
const projects=document.getElementById('projects'),journal=document.getElementById('journal');['projectBtn','projectBtn2'].forEach(id=>document.getElementById(id).onclick=()=>projects.classList.add('open'));['journalBtn','journalBtn2'].forEach(id=>document.getElementById(id).onclick=()=>journal.classList.add('open'));document.getElementById('closeProjects').onclick=()=>projects.classList.remove('open');document.getElementById('closeJournal').onclick=()=>journal.classList.remove('open');
document.querySelectorAll('.projectMenu button[data-img]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.projectMenu button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const im=document.getElementById('projectImg');im.style.opacity=.25;setTimeout(()=>{im.src=b.dataset.img;document.getElementById('projectTitle').textContent=b.dataset.title;im.style.opacity=.92},220)});
</script></body></html>
