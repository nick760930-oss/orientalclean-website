<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>東方繩洗｜Cinematic Scrub</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f8fcfd;color:#083640;font-family:"Noto Sans TC","Helvetica Neue",Arial,sans-serif}body{height:620vh}:root{--b:#00AFC8;--deep:#083640}
.stage{position:fixed;inset:0;overflow:hidden;background:#fbfefe}.nav{position:absolute;z-index:30;top:0;left:0;right:0;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.nav img{height:24px;width:auto}.nav span{font:10px ui-monospace,monospace;letter-spacing:.15em;color:#66858b}
.scene{position:absolute;inset:0}.field{position:absolute;inset:0;background:linear-gradient(110deg,#fff 0 55%,#edf9fb 55% 100%)}.tower{position:absolute;right:8vw;top:8vh;width:37vw;height:84vh;border-left:1px solid #8fcbd3;border-right:1px solid #8fcbd3;transform-origin:center;transition:.08s linear}.floor{position:absolute;left:0;right:0;height:1px;background:#b9dfe4}.floor:nth-child(1){top:12%}.floor:nth-child(2){top:27%}.floor:nth-child(3){top:42%}.floor:nth-child(4){top:57%}.floor:nth-child(5){top:72%}.floor:nth-child(6){top:87%}.rope{position:absolute;z-index:5;right:27vw;top:-5vh;width:2px;height:110vh;background:var(--b);transform-origin:top}.worker{position:absolute;z-index:6;right:calc(27vw - 13px);top:12vh;width:28px;height:52px}.worker:before{content:"";position:absolute;left:8px;width:12px;height:12px;border-radius:50%;background:#083640}.worker:after{content:"";position:absolute;left:5px;top:14px;width:18px;height:30px;border-radius:8px 8px 3px 3px;background:var(--b);box-shadow:-8px 11px 0 -6px #083640,8px 11px 0 -6px #083640}.copy{position:absolute;z-index:8;left:6vw;top:50%;transform:translateY(-50%);width:min(540px,72vw)}.kicker{font:10px ui-monospace,monospace;letter-spacing:.18em;color:#63878e}.copy h1{font-size:clamp(52px,8vw,108px);font-weight:500;line-height:.9;letter-spacing:-.07em;margin:20px 0;color:var(--deep)}.copy p{font-size:16px;line-height:1.8;color:#5c777d;max-width:480px}.word{color:var(--b)}.scan{position:absolute;z-index:4;right:8vw;width:37vw;height:2px;top:20%;background:var(--b);box-shadow:0 0 22px #00afc888;opacity:0}.water{position:absolute;z-index:3;right:8vw;top:8vh;width:37vw;height:84vh;opacity:0;background:repeating-linear-gradient(100deg,transparent 0 22px,#00afc824 23px 24px,transparent 25px 48px);transform:translateY(-20%)}.real{position:absolute;inset:0;opacity:0;background:linear-gradient(90deg,#fff 0%,#ffffffd9 28%,transparent 58%),url('/images/case-morten41.jpg') center/cover}.progress{position:absolute;z-index:40;bottom:0;left:0;height:3px;background:var(--b);width:100%;transform-origin:left;transform:scaleX(0)}.counter{position:absolute;z-index:30;right:24px;bottom:22px;font:10px ui-monospace,monospace;color:#66858b}.hint{position:absolute;z-index:30;left:6vw;bottom:5vh;font:10px ui-monospace,monospace;letter-spacing:.14em;color:#66858b}.endActions{position:absolute;z-index:20;left:6vw;bottom:12vh;opacity:0;pointer-events:none}.endActions a{display:inline-block;background:var(--deep);color:white;padding:14px 19px;text-decoration:none;margin-right:8px;font-size:13px}.endActions a.alt{background:#fff;color:var(--deep);border:1px solid #b9dfe4}
@media(max-width:720px){body{height:520vh}.nav{padding:15px 16px}.tower{right:-5vw;width:48vw}.rope{right:18vw}.worker{right:calc(18vw - 13px)}.scan,.water{right:-5vw;width:48vw}.copy{left:6vw;top:43%;width:65vw}.copy h1{font-size:15vw}.real{background:linear-gradient(0deg,#fff 0%,#ffffffd9 28%,transparent 58%),url('/images/case-morten41.jpg') center/cover}.endActions{left:6vw;bottom:8vh}}
</style></head><body><main class="stage"><nav class="nav"><img src="/images/logo-brand-color.png" alt="東方繩洗"><span>CINEMATIC STUDY / V7</span></nav><div class="scene"><div class="field"></div><div class="real" id="real"></div><div class="tower" id="tower"><i class="floor"></i><i class="floor"></i><i class="floor"></i><i class="floor"></i><i class="floor"></i><i class="floor"></i></div><div class="water" id="water"></div><div class="scan" id="scan"></div><div class="rope" id="rope"></div><div class="worker" id="worker"></div><section class="copy"><div class="kicker" id="kicker">ORIENTAL CLEAN / FACADE WORK</div><h1 id="title">從<span class="word">高度</span>開始。</h1><p id="desc">往下滑。這次不是移動頁面，而是控制一段東方繩洗的品牌動畫。</p></section><div class="endActions" id="actions"><a href="#">工程案例</a><a class="alt" href="#">工程筆記</a></div><div class="hint" id="hint">SCROLL TO CONTROL / 滑動控制畫面</div><div class="counter" id="counter">001 / 160</div><div class="progress" id="progress"></div></div></main><script>
const worker=document.getElementById('worker'),tower=document.getElementById('tower'),rope=document.getElementById('rope'),scan=document.getElementById('scan'),water=document.getElementById('water'),real=document.getElementById('real'),title=document.getElementById('title'),desc=document.getElementById('desc'),kicker=document.getElementById('kicker'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),actions=document.getElementById('actions'),hint=document.getElementById('hint');
const scenes=[
[0,.18,'ROPE ACCESS / 01','從<span class="word">高度</span>開始。','繩索讓我們進入一般設備不容易抵達的位置。'],
[.18,.42,'CLEANING / 02','外牆<span class="word">清洗</span>','材質、污染與現場條件不同，清潔方式也不同。'],
[.42,.66,'REPAIR / 03','外牆<span class="word">修繕</span>','先確認缺失範圍，再決定局部修補、補強或打除重做。'],
[.66,.84,'INSPECTION / 04','高空<span class="word">檢查</span>','把難以抵達的位置，整理成可以判讀與追蹤的工程資訊。'],
[.84,1,'FIELD WORK / 05','回到<span class="word">真實現場</span>','案例、施工紀錄與工程筆記，才是網站真正要留下的內容。']];
let last=-1;
function tick(){const max=document.documentElement.scrollHeight-innerHeight,p=Math.max(0,Math.min(1,scrollY/max)),frame=Math.min(160,Math.max(1,Math.round(1+p*159)));counter.textContent=String(frame).padStart(3,'0')+' / 160';progress.style.transform='scaleX('+p+')';worker.style.transform='translateY('+(p*64)+'vh) rotate('+(Math.sin(p*12)*2)+'deg)';rope.style.transform='rotate('+(Math.sin(p*8)*.5)+'deg)';tower.style.transform='scale('+(1+p*.08)+') translateY('+(-p*3)+'%)';water.style.opacity=Math.max(0,Math.min(1,(p-.16)*5))*Math.max(0,Math.min(1,(.48-p)*8));water.style.transform='translateY('+(-20+p*55)+'%)';scan.style.opacity=p>.62&&p<.86?1:0;scan.style.top=(18+Math.max(0,p-.62)*210)+'%';real.style.opacity=Math.max(0,(p-.82)/.18);actions.style.opacity=p>.93?1:0;actions.style.pointerEvents=p>.93?'auto':'none';hint.style.opacity=1-Math.min(1,p*5);const i=scenes.findIndex(s=>p>=s[0]&&p<=s[1]);if(i>=0&&i!==last){last=i;kicker.textContent=scenes[i][2];title.innerHTML=scenes[i][3];desc.textContent=scenes[i][4]}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
