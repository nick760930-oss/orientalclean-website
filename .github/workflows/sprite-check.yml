name: sprite-check
on:
  pull_request:
    paths: ['icons/**', 'scripts/build_sprite.py', 'images/sprite.*', 'assets/icons.css']
  push:
    branches: [main]
    paths: ['icons/**', 'scripts/build_sprite.py', 'images/sprite.*', 'assets/icons.css']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python3 scripts/build_sprite.py --check
