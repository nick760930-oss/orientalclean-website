<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>東方繩洗｜官網改版驗收</title><style>*{box-sizing:border-box}body{margin:0;background:#dce6e8;color:#102d34;font-family:system-ui,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;background:#fff;border-bottom:1px solid #c6d8dc}strong{font-size:15px}nav{display:flex;gap:7px;align-items:center}button,a{font:14px system-ui,sans-serif;border:0;padding:9px 15px;cursor:pointer;color:#102d34;text-decoration:none;background:#e9f0f1}button[aria-pressed=true]{background:#102d34;color:white}main{height:calc(100dvh - 64px);display:flex;justify-content:center;overflow:hidden;align-items:center}iframe{border:0;background:white;width:100%;height:100%;transition:width .3s,height .3s,border-radius .3s}main.mobile iframe{width:390px;max-width:100%;height:calc(100% - 32px);max-height:844px;border-radius:24px;box-shadow:0 10px 35px #102d3440;border:6px solid #102d34}button:focus-visible,a:focus-visible{outline:3px solid #299bb0;outline-offset:2px}@media(max-width:650px){header{height:55px;padding:0 14px}strong{font-size:13px}nav button{display:none}nav a{font-size:12px;padding:8px}main{height:calc(100dvh - 55px)}main.mobile iframe{border:0;border-radius:0;height:100%;max-height:none;width:100%}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}</style></head><body><header><strong>東方繩洗 · 官網改版驗收</strong><nav aria-label="預覽尺寸"><button id="desktop" aria-pressed="true">電腦版</button><button id="mobile" aria-pressed="false">手機版</button><a href="design-preview.html" target="_blank" rel="noopener">直接開啟 ↗</a></nav></header><main><iframe src="design-preview.html" title="東方繩洗官網設計預覽"></iframe></main><script>const m=document.querySelector('main'),desktop=document.querySelector('#desktop'),mobile=document.querySelector('#mobile');function mode(phone){m.classList.toggle('mobile',phone);desktop.setAttribute('aria-pressed',String(!phone));mobile.setAttribute('aria-pressed',String(phone))}desktop.onclick=()=>mode(false);mobile.onclick=()=>mode(true);</script></body></html>
